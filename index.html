<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5efe5">

  <title>Fox &amp; Heron — Make every customer moment count</title>
  <style>
    :root{
      --ink:#101c2c; --muted:#5e6b7a; --paper:#f7f8f5; --white:#fff;
      --lime:#c8f169; --lime-dark:#a7d84a; --line:#e3e8e4; --blue:#234b68;
      --radius:22px; --shadow:0 18px 55px rgba(16,28,44,.10);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.55}
    a{color:inherit;text-decoration:none}
    .wrap{width:min(1160px,calc(100% - 44px));margin:auto}
    .nav{height:82px;display:flex;align-items:center;justify-content:space-between;gap:20px}

    .brand{display:flex;align-items:center;gap:10px;font-size:1.15rem;font-weight:800;letter-spacing:-.04em}
    .brand-logo{display:block;width:48px;height:48px;object-fit:contain;border-radius:10px}
    .brand-wordmark{display:flex;flex-direction:column;line-height:1.02;letter-spacing:-.045em}
    .brand-wordmark .amp{font-size:.82em;color:#718d4f}
    footer .brand-logo{background:#faf6ef}

    .brand{display:flex;align-items:center;gap:10px;font-size:1.15rem;font-weight:800;letter-spacing:-.04em}
    .brand-mark{width:34px;height:34px;border-radius:11px;background:var(--lime);display:grid;place-items:center;color:var(--ink);font-weight:900;font-size:19px}
    .navlinks{display:flex;align-items:center;gap:28px;font-size:.92rem;color:#475466}
    .navlinks a:hover{color:var(--ink)}
    .button{display:inline-flex;align-items:center;justify-content:center;gap:9px;border-radius:999px;padding:13px 19px;font-weight:750;font-size:.92rem;border:1px solid transparent;transition:transform .2s,background .2s}
    .button:hover{transform:translateY(-2px)}
    .button-dark{background:var(--ink);color:white}
    .button-dark:hover{background:#40564d}
    .button-light{border-color:#cbd3d7;background:transparent}
    .button-lime{background:var(--lime);color:var(--ink)}
    .button-lime:hover{background:#d6f68e}
    .hero{padding:62px 0 84px;position:relative;overflow:hidden}
    .hero-grid{display:grid;grid-template-columns:1.06fr .94fr;gap:62px;align-items:center}
    .eyebrow{display:inline-flex;align-items:center;gap:9px;text-transform:uppercase;letter-spacing:.13em;font-size:.72rem;font-weight:850;color:#657b4e}
    .eyebrow:before{content:"";width:22px;height:2px;background:var(--lime-dark)}
    h1{font-size:clamp(3rem,6.4vw,5.8rem);line-height:.99;letter-spacing:-.075em;margin:20px 0 24px;max-width:700px}
    h1 span{color:#718d4f}
    .hero-copy{font-size:1.13rem;line-height:1.7;color:var(--muted);max-width:550px}
    .hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin:30px 0 22px}
    .microcopy{font-size:.82rem;color:#7a8591}
    .dashboard{background:#334841;border-radius:28px;padding:24px;color:#fffdf8;box-shadow:0 32px 90px rgba(47,63,53,.16);position:relative}
    .dash-top{display:flex;align-items:center;justify-content:space-between;padding-bottom:22px;border-bottom:1px solid rgba(255,255,255,.12)}
    .dash-label{font-size:.78rem;color:#a9b7c7}
    .live{display:flex;align-items:center;gap:7px;color:#d4f98d;font-size:.76rem;font-weight:700}
    .live:before{content:"";width:7px;height:7px;background:var(--lime);border-radius:50%}
    .dash-title{font-size:1.42rem;font-weight:750;letter-spacing:-.04em;margin:23px 0 4px}
    .dash-sub{font-size:.83rem;color:#a9b7c7}
    .metric-row{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:22px 0}
    .metric{border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:16px;background:rgba(255,255,255,.035)}
    .metric small{color:#a9b7c7;font-size:.75rem}
    .metric strong{display:block;font-size:1.8rem;letter-spacing:-.05em;margin:7px 0 1px}
    .trend{font-size:.74rem;color:#d4f98d}

    .signal{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;background:rgba(255,255,255,.055)}
